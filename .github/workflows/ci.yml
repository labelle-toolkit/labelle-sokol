name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: build + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install sokol system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev \
            libxi-dev libxcursor-dev libsdl2-dev
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        # The desktop gamepad source (labelle-sdl-gamepad) links SDL2; input.zig
        # links it on macOS too.
        run: brew install sdl2
      - name: Build + test
        run: zig build test

      # Material seam golden (labelle-gfx#305): render the fixed 10-column
      # scene covering the FULL curated set (flash, palette_swap, dissolve,
      # outline + atlas/tint/threshold boundary cases, mirroring the bgfx
      # golden) surfaceless-headless (raw Metal, no GUI session) and diff it
      # against the committed golden BMP. macOS-only — the headless path is
      # Metal (`window.beginHeadless`); the step doesn't exist on the Linux
      # leg. Regenerate with `zig build material-golden-bless` after an
      # intentional shader change.
      - name: Material golden (macOS)
        if: runner.os == 'macOS'
        run: zig build material-golden

      # Post-fx seam golden (labelle-gfx#305 Phase 3): render the fixed scene,
      # run a bloom→crt post-fx stack through the render-target ping-pong
      # surfaceless-headless (raw Metal), and diff against the committed golden
      # BMP. Pins the four post-fx shader dialects. macOS-only (Metal headless).
      # Regenerate with `zig build post-fx-golden-bless` after a shader change.
      - name: Post-fx golden (macOS)
        if: runner.os == 'macOS'
        run: zig build post-fx-golden

      # Post-fx INTEGRATION golden (labelle-gfx#305 Phase 3): drive the REAL gfx
      # `PostFxDriver` (test-dep labelle-gfx, its core unified onto sokol's) over
      # the sokol backend with a bloom→crt stack, surfaceless-headless, and diff
      # against the same reference. Proves the sokol DEFERRED post-fx model
      # (plan-then-execute-at-flushScene) faithfully realises the driver's
      # begin/applyPostPass/resolve ping-pong. macOS-only (Metal headless).
      - name: Post-fx integration golden (macOS)
        if: runner.os == 'macOS'
        run: zig build post-fx-integration-golden

  # Integration: generate + build the sokol desktop example (which now lives HERE,
  # not in labelle-assembler — the backend-agnosticism remainder, assembler#520).
  # Verifies the sokol backend works end-to-end through the toolkit against THIS
  # repo's code: the example pins its backend to `local:../..` (this checkout) via
  # `.backend_package`, released core/engine/gfx (fetched), and the assembler/cli as
  # siblings built from main. Runs on macOS (sokol desktop → Metal). Build-only —
  # produces the `example_sokol` binary; no windowed run. (A headless-screenshot
  # smoke check is a possible follow-up: sokol is the one backend that can render
  # with no GUI session, assembler >=0.53.)
  example-build:
    name: sokol desktop example generate + build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout labelle-sokol
        uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: main
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The desktop gamepad source (labelle-sdl-gamepad) links SDL2; the sokol
      # desktop input path links it on macOS too.
      - name: Install SDL2 (macOS)
        run: brew install sdl2

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            labelle-sokol/examples/sokol/.labelle/sokol_desktop/.zig-cache
          key: sokol-example-${{ hashFiles('labelle-sokol/examples/sokol/project.labelle', 'labelle-sokol/build.zig.zon') }}
          restore-keys: |
            sokol-example-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: cd labelle-cli && zig build

      - name: Generate + build the example
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          cd labelle-sokol/examples/sokol
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" generate
          cd .labelle/sokol_desktop
          zig build

      - name: Verify example binary
        run: |
          set -euo pipefail
          bin=$(find labelle-sokol/examples/sokol/.labelle/sokol_desktop/zig-out/bin -name 'example_sokol' | head -1)
          if [ -z "$bin" ]; then echo "example_sokol not built"; exit 1; fi
          echo "found: $bin"
          file "$bin"

  # Integration: generate + build the sokol + Dear ImGui desktop example (which
  # now lives HERE, not in labelle-assembler — assembler#520). Same shape as the
  # `example-build` job above, but exercises the `imgui` GUI plugin's SOKOL
  # bridge: the example pins the published `labelle-imgui` (0.10.0) and the
  # backend to THIS repo via `.backend_package = local:../..`. Runs on macOS
  # (sokol desktop → Metal). Build-only — produces `example_sokol_imgui`.
  imgui-example-build:
    name: sokol + imgui desktop example generate + build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout labelle-sokol
        uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: main
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The desktop gamepad source (labelle-sdl-gamepad) links SDL2; the sokol
      # desktop input path links it on macOS too.
      - name: Install SDL2 (macOS)
        run: brew install sdl2

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            labelle-sokol/examples/sokol_imgui/.labelle/sokol_desktop/.zig-cache
          key: sokol-imgui-example-${{ hashFiles('labelle-sokol/examples/sokol_imgui/project.labelle', 'labelle-sokol/build.zig.zon') }}
          restore-keys: |
            sokol-imgui-example-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: cd labelle-cli && zig build

      - name: Generate + build the example
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          cd labelle-sokol/examples/sokol_imgui
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" generate
          cd .labelle/sokol_desktop
          zig build

      - name: Verify example binary
        run: |
          set -euo pipefail
          bin=$(find labelle-sokol/examples/sokol_imgui/.labelle/sokol_desktop/zig-out/bin -name 'example_sokol_imgui' | head -1)
          if [ -z "$bin" ]; then echo "example_sokol_imgui not built"; exit 1; fi
          echo "found: $bin"
          file "$bin"

  # Integration: generate + cross-build the gamepad-android example (sokol +
  # imgui, Android). Mirrors labelle-bgfx's `android-example` .so job — NDK
  # cross-build, no device/emulator/APK. Produces the aarch64 NativeActivity
  # libgame.so.
  #
  # This migration is the first consumer of the sokol-Android manifest-splice
  # (`backend_package`) path, so it surfaced a gap: the `.backend_sokol_android`
  # template section was missing the `backend_input` labelle-core override that
  # `.backend_bgfx_android` already carried (the sokol Android input adapter
  # imports labelle-core for `AndroidBackendContext`, the vtable handed to
  # `engine.core.registerAndroidBackend`; without the override `input` resolves
  # its OWN pinned core tarball and the build fails to type-check). Fixed in
  # labelle-assembler#524 (now on assembler `main`), so this is a hard-required
  # job. See assembler#520 / labelle-imgui#25.
  gamepad-android-example:
    name: gamepad-android example .so cross-build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout labelle-sokol
        uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout provider CLI (development)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: development
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Cache the cross-compiled sokol/cimgui C/C++ (the expensive part).
      - name: Cache Zig Android build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            labelle-sokol/examples/gamepad-android/.labelle/sokol_android/.zig-cache
          key: sokol-android-${{ hashFiles('labelle-sokol/examples/gamepad-android/project.labelle', 'labelle-sokol/build.zig.zon') }}
          restore-keys: |
            sokol-android-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: |
          cd labelle-cli || exit 1
          zig build -Dversion=2.0.0

      # Released assembler install expects a hostname in repo strings, while
      # provider locks use owner/repo. Stage this pin until that seam is fixed.
      - name: Stage Android provider for assembler
        run: |
          set -euo pipefail
          dst="$HOME/.labelle/packages/plugins/labelle-toolkit/labelle-android/0.2.0"
          mkdir -p "$dst"
          curl -fsSL https://github.com/labelle-toolkit/labelle-android/archive/refs/tags/v0.2.0.tar.gz -o "$RUNNER_TEMP/android-provider.tar.gz"
          tar -xzf "$RUNNER_TEMP/android-provider.tar.gz" -C "$dst" --strip-components=1

      - name: Generate + cross-build libgame.so (aarch64-linux-android)
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd labelle-sokol/examples/gamepad-android || exit 1
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" generate --platform=android
          cd .labelle/sokol_android || exit 1
          zig build

      - name: Verify libgame.so
        run: |
          set -euo pipefail
          so=$(find labelle-sokol/examples/gamepad-android/.labelle/sokol_android -name 'libgame.so' | head -1)
          if [ -z "$so" ]; then echo "libgame.so not found"; exit 1; fi
          echo "found: $so"
          file "$so"
          file "$so" | grep -q 'ELF 64-bit.*ARM aarch64' || { echo "FAIL: not an aarch64 ELF"; exit 1; }
          # NativeActivity entry export (sokol's android glue provides
          # ANativeActivity_onCreate). Kept as a soft check.
          nm -D "$so" | grep -q 'ANativeActivity_onCreate' \
            && echo "ANativeActivity_onCreate exported" \
            || echo "WARN: ANativeActivity_onCreate not found in dynamic symbols"

  android-provider:
    name: Android provider D11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: D11 — provider plugin + sokol link ONE labelle_android (cli#405)
        env:
          D11_ASSEMBLER_TAG: v0.116.0
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          base="https://github.com/labelle-toolkit/labelle-assembler/releases/download/$D11_ASSEMBLER_TAG"
          mkdir -p "$RUNNER_TEMP/d11-assembler"
          cd "$RUNNER_TEMP/d11-assembler" || exit 1
          curl -fsSLO "$base/labelle-assembler-linux-x86_64"
          curl -fsSLO "$base/SHA256SUMS"
          grep ' labelle-assembler-linux-x86_64$' SHA256SUMS | sha256sum -c -
          chmod +x labelle-assembler-linux-x86_64
          asm="$PWD/labelle-assembler-linux-x86_64"

          # The bare assembler does not fetch packages: `generate` links them
          # from ~/.labelle/packages and fails on a clean runner. Stage every
          # package the fixture pins, in the layout the CLI/assembler cache
          # writes (the tag's source archive, top-level dir stripped):
          #   <kind>/<version> for core/gfx/engine,
          #   plugins/<repo>/<version> for a plugin. Keep in step with
          #   test/android-provider/project.labelle.
          pkgs="$HOME/.labelle/packages"
          stage() {  # <cache slot> <owner/repo> <tag>
            dst="$pkgs/$1"
            rm -rf "$dst"
            mkdir -p "$dst"
            curl -fsSL "https://github.com/$2/archive/$3.tar.gz" -o "$RUNNER_TEMP/d11-stage.tar.gz"
            tar -xzf "$RUNNER_TEMP/d11-stage.tar.gz" -C "$dst" --strip-components=1
            if [ ! -f "$dst/build.zig.zon" ]; then echo "FAIL: $dst has no build.zig.zon"; exit 1; fi
            echo "staged $1 <- $2@$3"
          }
          stage core/2.1.0 labelle-toolkit/labelle-core v2.1.0
          stage gfx/2.2.0 labelle-toolkit/labelle-gfx v2.2.0
          stage engine/3.4.1 labelle-toolkit/labelle-engine v3.4.1
          stage plugins/labelle-toolkit/labelle-android/0.2.0 labelle-toolkit/labelle-android v0.2.0

          cd "$GITHUB_WORKSPACE/labelle-sokol/test/android-provider" || exit 1
          # Capture, then check: a missing package is only a WARNING to
          # `generate` ("could not link dep"), and must fail this step.
          "$asm" generate --project-root . --platform android 2>&1 | tee "$RUNNER_TEMP/d11-generate.log"
          if grep -q 'could not link dep' "$RUNNER_TEMP/d11-generate.log"; then
            echo "FAIL: generate could not link a package; stage it above"; exit 1
          fi
          # The link IS the check: duplicate JNI C fails it.
          (cd .labelle/sokol_android || exit 1; zig build)

          so=$(find .labelle/sokol_android/zig-out -name 'libgame.so' | head -1)
          if [ -z "$so" ]; then echo "FAIL: libgame.so not found"; exit 1; fi
          fail=0
          defined=$(nm -D --defined-only "$so" | awk '$3 ~ /^labelle_android_/ { print $3 }' | sort)
          for sym in labelle_android_acquire_env labelle_android_read_intent_extras \
                     labelle_android_app_is_debuggable labelle_android_force_window_relayout; do
            n=$(printf '%s\n' "$defined" | grep -cx "$sym" || true)
            if [ "$n" -ne 1 ]; then echo "FAIL: $sym defined $n times (want 1)"; fail=1; else echo "ok    $sym x1"; fi
          done
          nm -D --undefined-only "$so" > "$RUNNER_TEMP/d11-undefined.txt"
          if grep -q 'labelle_android_' "$RUNNER_TEMP/d11-undefined.txt"; then
            echo "FAIL: unresolved Android runtime/gamepad callback"; fail=1
          fi
          dups=$(printf '%s\n' "$defined" | uniq -d)
          if [ -n "$dups" ]; then echo "FAIL: duplicated: $dups"; fail=1; fi
          # The mechanism, not just the count: the JNI C in the .so is the
          # PLUGIN's copy (.labelle/deps/labelle-android), and sokol's
          # hash-fetched copy (zig-pkg/labelle_android-<ver>-<hash>) is absent.
          # Into a file first: `strings | grep -q` under pipefail fails on the
          # SIGPIPE when grep stops reading early.
          strings -a "$so" > "$RUNNER_TEMP/d11-strings.txt"
          if ! grep -q 'deps/labelle-android/src/jni/intent_extras\.c' "$RUNNER_TEMP/d11-strings.txt"; then
            echo "FAIL: the JNI C is not the provider plugin's copy"; fail=1
          fi
          if grep -q 'labelle_android-[0-9][0-9.]*-[A-Za-z0-9_-]*/src/jni' "$RUNNER_TEMP/d11-strings.txt"; then
            echo "FAIL: sokol's own labelle_android copy reached the .so"; fail=1
          fi
          exit "$fail"
