name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: build + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install sokol system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev \
            libxi-dev libxcursor-dev libsdl2-dev
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        # The desktop gamepad source (labelle-sdl-gamepad) links SDL2; input.zig
        # links it on macOS too.
        run: brew install sdl2
      - name: Build + test
        run: zig build test

      # Material seam golden (labelle-gfx#305): render the fixed 10-column
      # scene covering the FULL curated set (flash, palette_swap, dissolve,
      # outline + atlas/tint/threshold boundary cases, mirroring the bgfx
      # golden) surfaceless-headless (raw Metal, no GUI session) and diff it
      # against the committed golden BMP. macOS-only — the headless path is
      # Metal (`window.beginHeadless`); the step doesn't exist on the Linux
      # leg. Regenerate with `zig build material-golden-bless` after an
      # intentional shader change.
      - name: Material golden (macOS)
        if: runner.os == 'macOS'
        run: zig build material-golden

      # Post-fx seam golden (labelle-gfx#305 Phase 3): render the fixed scene,
      # run a bloom→crt post-fx stack through the render-target ping-pong
      # surfaceless-headless (raw Metal), and diff against the committed golden
      # BMP. Pins the four post-fx shader dialects. macOS-only (Metal headless).
      # Regenerate with `zig build post-fx-golden-bless` after a shader change.
      - name: Post-fx golden (macOS)
        if: runner.os == 'macOS'
        run: zig build post-fx-golden

      # Post-fx INTEGRATION golden (labelle-gfx#305 Phase 3): drive the REAL gfx
      # `PostFxDriver` (test-dep labelle-gfx, its core unified onto sokol's) over
      # the sokol backend with a bloom→crt stack, surfaceless-headless, and diff
      # against the same reference. Proves the sokol DEFERRED post-fx model
      # (plan-then-execute-at-flushScene) faithfully realises the driver's
      # begin/applyPostPass/resolve ping-pong. macOS-only (Metal headless).
      - name: Post-fx integration golden (macOS)
        if: runner.os == 'macOS'
        run: zig build post-fx-integration-golden

  # Integration: generate + build the sokol desktop example (which now lives HERE,
  # not in labelle-assembler — the backend-agnosticism remainder, assembler#520).
  # Verifies the sokol backend works end-to-end through the toolkit against THIS
  # repo's code: the example pins its backend to `local:../..` (this checkout) via
  # `.backend_package`, released core/engine/gfx (fetched), and the assembler/cli as
  # siblings built from main. Runs on macOS (sokol desktop → Metal). Build-only —
  # produces the `example_sokol` binary; no windowed run. (A headless-screenshot
  # smoke check is a possible follow-up: sokol is the one backend that can render
  # with no GUI session, assembler >=0.53.)
  example-build:
    name: sokol desktop example generate + build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout labelle-sokol
        uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: main
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The desktop gamepad source (labelle-sdl-gamepad) links SDL2; the sokol
      # desktop input path links it on macOS too.
      - name: Install SDL2 (macOS)
        run: brew install sdl2

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            labelle-sokol/examples/sokol/.labelle/sokol_desktop/.zig-cache
          key: sokol-example-${{ hashFiles('labelle-sokol/examples/sokol/project.labelle', 'labelle-sokol/build.zig.zon') }}
          restore-keys: |
            sokol-example-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: cd labelle-cli && zig build

      - name: Generate + build the example
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          cd labelle-sokol/examples/sokol
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" generate
          cd .labelle/sokol_desktop
          zig build

      - name: Verify example binary
        run: |
          set -euo pipefail
          bin=$(find labelle-sokol/examples/sokol/.labelle/sokol_desktop/zig-out/bin -name 'example_sokol' | head -1)
          if [ -z "$bin" ]; then echo "example_sokol not built"; exit 1; fi
          echo "found: $bin"
          file "$bin"

  # Integration: generate + build the sokol + Dear ImGui desktop example (which
  # now lives HERE, not in labelle-assembler — assembler#520). Same shape as the
  # `example-build` job above, but exercises the `imgui` GUI plugin's SOKOL
  # bridge: the example pins the published `labelle-imgui` (0.10.0) and the
  # backend to THIS repo via `.backend_package = local:../..`. Runs on macOS
  # (sokol desktop → Metal). Build-only — produces `example_sokol_imgui`.
  imgui-example-build:
    name: sokol + imgui desktop example generate + build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout labelle-sokol
        uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: main
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The desktop gamepad source (labelle-sdl-gamepad) links SDL2; the sokol
      # desktop input path links it on macOS too.
      - name: Install SDL2 (macOS)
        run: brew install sdl2

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            labelle-sokol/examples/sokol_imgui/.labelle/sokol_desktop/.zig-cache
          key: sokol-imgui-example-${{ hashFiles('labelle-sokol/examples/sokol_imgui/project.labelle', 'labelle-sokol/build.zig.zon') }}
          restore-keys: |
            sokol-imgui-example-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: cd labelle-cli && zig build

      - name: Generate + build the example
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          cd labelle-sokol/examples/sokol_imgui
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" generate
          cd .labelle/sokol_desktop
          zig build

      - name: Verify example binary
        run: |
          set -euo pipefail
          bin=$(find labelle-sokol/examples/sokol_imgui/.labelle/sokol_desktop/zig-out/bin -name 'example_sokol_imgui' | head -1)
          if [ -z "$bin" ]; then echo "example_sokol_imgui not built"; exit 1; fi
          echo "found: $bin"
          file "$bin"

  # Integration: generate + cross-build the gamepad-android example (sokol +
  # imgui, Android). Mirrors labelle-bgfx's `android-example` .so job — NDK
  # cross-build, no device/emulator/APK. Produces the aarch64 NativeActivity
  # libgame.so.
  #
  # This migration is the first consumer of the sokol-Android manifest-splice
  # (`backend_package`) path, so it surfaced a gap: the `.backend_sokol_android`
  # template section was missing the `backend_input` labelle-core override that
  # `.backend_bgfx_android` already carried (the sokol Android input adapter
  # imports labelle-core for `AndroidBackendContext`, the vtable handed to
  # `engine.core.registerAndroidBackend`; without the override `input` resolves
  # its OWN pinned core tarball and the build fails to type-check). Fixed in
  # labelle-assembler#524 (now on assembler `main`), so this is a hard-required
  # job. See assembler#520 / labelle-imgui#25.
  gamepad-android-example:
    name: gamepad-android example .so cross-build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout labelle-sokol
        uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      # Pinned to an immutable commit, not the moving `development` branch:
      # the #444 merge (github.com/ repo matching + `labelle providers fetch`).
      # Move this to the labelle-cli v2.0.0 tag once it is released.
      - name: Checkout provider CLI (development @ cli#444)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: 9e4625623fa2789fae3e774d6ed42600c10fdd96
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Cache the cross-compiled sokol/cimgui C/C++ (the expensive part).
      - name: Cache Zig Android build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            labelle-sokol/examples/gamepad-android/.labelle/sokol_android/.zig-cache
          key: sokol-android-${{ hashFiles('labelle-sokol/examples/gamepad-android/project.labelle', 'labelle-sokol/build.zig.zon') }}
          restore-keys: |
            sokol-android-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: |
          cd labelle-cli || exit 1
          zig build -Dversion=2.0.0

      # A fresh runner has no provider archives cached, and `generate` does not
      # download them (it fails with ProviderArchiveMissing). `providers fetch`
      # downloads exactly what labelle.providers.lock pins and checks each
      # sha256. The assembler fetches the plugin package itself during
      # generate (the `github.com/` repo form in project.labelle).
      - name: Fetch pinned provider archives
        run: |
          cd labelle-sokol/examples/gamepad-android || exit 1
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" providers fetch

      - name: Generate + cross-build libgame.so (aarch64-linux-android)
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd labelle-sokol/examples/gamepad-android || exit 1
          "$GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle" generate --platform=android
          cd .labelle/sokol_android || exit 1
          zig build

      - name: Verify libgame.so
        run: |
          set -euo pipefail
          so=$(find labelle-sokol/examples/gamepad-android/.labelle/sokol_android -name 'libgame.so' | head -1)
          if [ -z "$so" ]; then echo "libgame.so not found"; exit 1; fi
          echo "found: $so"
          file "$so"
          file "$so" | grep -q 'ELF 64-bit.*ARM aarch64' || { echo "FAIL: not an aarch64 ELF"; exit 1; }
          # NativeActivity entry export (sokol's android glue provides
          # ANativeActivity_onCreate). Kept as a soft check.
          nm -D "$so" | grep -q 'ANativeActivity_onCreate' \
            && echo "ANativeActivity_onCreate exported" \
            || echo "WARN: ANativeActivity_onCreate not found in dynamic symbols"

  android-provider:
    name: Android provider D11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: D11 — provider plugin + sokol link ONE labelle_android (cli#405)
        env:
          D11_ASSEMBLER_TAG: v0.116.1
          # Pinned digest of that release's labelle-assembler-linux-x86_64, so
          # a moved tag or replaced asset (with a matching SHA256SUMS) fails
          # here. Update it together with D11_ASSEMBLER_TAG.
          D11_ASSEMBLER_SHA256: 40ff817f4f9bc712993fe347bd40a0b23afba97d4c776d6b6b565d83f4652eb0
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          base="https://github.com/labelle-toolkit/labelle-assembler/releases/download/$D11_ASSEMBLER_TAG"
          mkdir -p "$RUNNER_TEMP/d11-assembler"
          cd "$RUNNER_TEMP/d11-assembler" || exit 1
          curl -fsSLO "$base/labelle-assembler-linux-x86_64"
          echo "$D11_ASSEMBLER_SHA256  labelle-assembler-linux-x86_64" | sha256sum -c -
          chmod +x labelle-assembler-linux-x86_64
          asm="$PWD/labelle-assembler-linux-x86_64"

          cd "$GITHUB_WORKSPACE/labelle-sokol/test/android-provider" || exit 1
          # The bare assembler's `generate` only links packages already in
          # ~/.labelle/packages; `install` fetches every package the fixture
          # pins (core/gfx/engine and the github.com/ android plugin) first.
          # Clean-home install works from assembler v0.116.1.
          "$asm" install --project-root .
          # Capture, then check: a missing package is only a WARNING to
          # `generate` ("could not link dep"), and must fail this step.
          "$asm" generate --project-root . --platform android 2>&1 | tee "$RUNNER_TEMP/d11-generate.log"
          if grep -q 'could not link dep' "$RUNNER_TEMP/d11-generate.log"; then
            echo "FAIL: generate could not link a package that install should have fetched"; exit 1
          fi
          # The link IS the check: duplicate JNI C fails it.
          (cd .labelle/sokol_android || exit 1; zig build)

          so=$(find .labelle/sokol_android/zig-out -name 'libgame.so' | head -1)
          if [ -z "$so" ]; then echo "FAIL: libgame.so not found"; exit 1; fi
          fail=0
          defined=$(nm -D --defined-only "$so" | awk '$3 ~ /^labelle_android_/ { print $3 }' | sort)
          for sym in labelle_android_acquire_env labelle_android_read_intent_extras \
                     labelle_android_app_is_debuggable labelle_android_force_window_relayout; do
            n=$(printf '%s\n' "$defined" | grep -cx "$sym" || true)
            if [ "$n" -ne 1 ]; then echo "FAIL: $sym defined $n times (want 1)"; fail=1; else echo "ok    $sym x1"; fi
          done
          nm -D --undefined-only "$so" > "$RUNNER_TEMP/d11-undefined.txt"
          if grep -q 'labelle_android_' "$RUNNER_TEMP/d11-undefined.txt"; then
            echo "FAIL: unresolved Android runtime/gamepad callback"; fail=1
          fi
          dups=$(printf '%s\n' "$defined" | uniq -d)
          if [ -n "$dups" ]; then echo "FAIL: duplicated: $dups"; fail=1; fi
          # The mechanism, not just the count: the JNI C in the .so is the
          # PLUGIN's copy (.labelle/deps/labelle-android), and sokol's
          # hash-fetched copy (zig-pkg/labelle_android-<ver>-<hash>) is absent.
          # Into a file first: `strings | grep -q` under pipefail fails on the
          # SIGPIPE when grep stops reading early.
          strings -a "$so" > "$RUNNER_TEMP/d11-strings.txt"
          if ! grep -q 'deps/labelle-android/src/jni/intent_extras\.c' "$RUNNER_TEMP/d11-strings.txt"; then
            echo "FAIL: the JNI C is not the provider plugin's copy"; fail=1
          fi
          if grep -q 'labelle_android-[0-9][0-9.]*-[A-Za-z0-9_-]*/src/jni' "$RUNNER_TEMP/d11-strings.txt"; then
            echo "FAIL: sokol's own labelle_android copy reached the .so"; fail=1
          fi
          exit "$fail"

  # RFC labelle-cli#471 I0: keep the sokol iOS path building. sokol is the only
  # backend that declares iOS, and nothing else in the toolkit builds it. This
  # job runs the released assembler (pinned + sha256-checked) on a clean macOS
  # runner against the minimal test/ios fixture, then builds the generated
  # project for the arm64 simulator and, compile-only, for a device. No
  # signing, no .app wrapping, no simulator launch (that is labelle-ios, I1).
  ios-build:
    name: iOS build (simulator + device, compile-only)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: labelle-sokol
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Show the Xcode toolchain
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
      - name: Fetch the pinned assembler and generate for iOS
        env:
          IOS_ASSEMBLER_TAG: v0.117.1
          # Pinned digest of that release's labelle-assembler-macos-aarch64, so
          # a moved tag or replaced asset fails here. Update it together with
          # IOS_ASSEMBLER_TAG (and `.assembler_version` in test/ios).
          IOS_ASSEMBLER_SHA256: 92ed762c9e11d281eb9a7548ee889d43576a1126c546c871332859e32e4298d9
        run: |
          set -euo pipefail
          base="https://github.com/labelle-toolkit/labelle-assembler/releases/download/$IOS_ASSEMBLER_TAG"
          mkdir -p "$RUNNER_TEMP/ios-assembler"
          cd "$RUNNER_TEMP/ios-assembler" || exit 1
          curl -fsSLO "$base/labelle-assembler-macos-aarch64"
          echo "$IOS_ASSEMBLER_SHA256  labelle-assembler-macos-aarch64" | shasum -a 256 -c -
          chmod +x labelle-assembler-macos-aarch64
          asm="$PWD/labelle-assembler-macos-aarch64"

          cd "$GITHUB_WORKSPACE/labelle-sokol/test/ios" || exit 1
          "$asm" install --project-root .
          "$asm" generate --project-root . --platform ios 2>&1 | tee "$RUNNER_TEMP/ios-generate.log"
          if grep -q 'could not link dep' "$RUNNER_TEMP/ios-generate.log"; then
            echo "FAIL: generate could not link a package that install should have fetched"; exit 1
          fi
          test -f .labelle/sokol_ios/build.zig
      - name: Build for the arm64 simulator
        run: |
          set -euo pipefail
          cd labelle-sokol/test/ios/.labelle/sokol_ios || exit 1
          zig build -Doptimize=ReleaseFast
          exe=zig-out/bin/game
          test -f "$exe" || { echo "FAIL: $exe not built"; ls -R zig-out || true; exit 1; }
          file "$exe"
          file "$exe" | grep -q 'Mach-O 64-bit executable arm64' || { echo "FAIL: not an arm64 Mach-O"; exit 1; }
          # The simulator platform, not macOS or a device (LC_BUILD_VERSION).
          otool -l "$exe" > "$RUNNER_TEMP/ios-sim-loadcmds.txt"
          grep -A4 LC_BUILD_VERSION "$RUNNER_TEMP/ios-sim-loadcmds.txt"
          grep -A4 LC_BUILD_VERSION "$RUNNER_TEMP/ios-sim-loadcmds.txt" | grep -Eq 'platform (7|IOSSIMULATOR)' \
            || { echo "FAIL: not built for the iOS simulator"; exit 1; }
      - name: Build for a device (compile-only, unsigned)
        run: |
          set -euo pipefail
          cd labelle-sokol/test/ios/.labelle/sokol_ios || exit 1
          rm -rf zig-out
          zig build -Doptimize=ReleaseFast -Ddevice=true
          exe=zig-out/bin/game
          test -f "$exe" || { echo "FAIL: $exe not built"; ls -R zig-out || true; exit 1; }
          file "$exe"
          file "$exe" | grep -q 'Mach-O 64-bit executable arm64' || { echo "FAIL: not an arm64 Mach-O"; exit 1; }
          otool -l "$exe" > "$RUNNER_TEMP/ios-dev-loadcmds.txt"
          grep -A4 LC_BUILD_VERSION "$RUNNER_TEMP/ios-dev-loadcmds.txt"
          grep -A4 LC_BUILD_VERSION "$RUNNER_TEMP/ios-dev-loadcmds.txt" | grep -Eq 'platform (2|IOS)$' \
            || { echo "FAIL: not built for an iOS device"; exit 1; }

  # labelle-sokol#33: a valid EMSDK (labelle-web 0.3 exports EMSDK, EM_CONFIG
  # and PATH) is honoured, and sokol-zig's OWN emsdk package (a different
  # pin) is never installed. Before #33, sokol_clib ran sokol-zig's
  # `emsdk install/activate latest` anyway: a second ~1.5 GB download per
  # cold runner. Asserts the MECHANISM, not only a green build:
  #   1. `-Demsdk_expect` gates both ways (EMSDK unset refuses `external`,
  #      a valid EMSDK refuses `package`);
  #   2. no emsdk setup ran: no "(zig-pkg emsdk)" step and no sokol-zig
  #      `run bash` step;
  #   3. no emsdk package under zig-pkg/ has `upstream/` or `.emscripten`, and
  #      sokol-zig's (always fetched) was among those checked;
  #   4. sokol_gfx.c compiled against ONLY EMSDK's sysroot (--verbose-cc).
  wasm-external-emsdk:
    name: wasm sokol_clib with an external EMSDK (no zig-pkg emsdk install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXT_EMSDK_VERSION: 4.0.9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Configure-only (`--help` runs build() but no steps).
      - name: EMSDK unset refuses expect=external
        env:
          EMSDK: ''
        run: |
          set -uo pipefail
          if zig build -Dtarget=wasm32-emscripten -Demsdk_expect=external --help > gate.log 2>&1; then
            echo "FAIL: -Demsdk_expect=external passed with EMSDK unset"; exit 1
          fi
          grep -F "the emsdk Zig package was chosen" gate.log \
            || { cat gate.log; echo "FAIL: expect=external failed for another reason"; exit 1; }
      - name: Cache the external emsdk
        id: ext-emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ext-emsdk
          key: ext-emsdk-${{ runner.os }}-${{ env.EXT_EMSDK_VERSION }}
      - name: Install the external emsdk
        if: steps.ext-emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$EXT_EMSDK_VERSION" https://github.com/emscripten-core/emsdk ~/ext-emsdk
          cd ~/ext-emsdk
          ./emsdk install "$EXT_EMSDK_VERSION"
          ./emsdk activate "$EXT_EMSDK_VERSION"
      - name: Export EMSDK, EM_CONFIG and PATH
        run: |
          set -euo pipefail
          root="$HOME/ext-emsdk"
          test -d "$root/upstream/emscripten"
          test -f "$root/.emscripten"
          echo "EMSDK=$root" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$root/.emscripten" >> "$GITHUB_ENV"
          echo "$root/upstream/emscripten" >> "$GITHUB_PATH"
      - name: A valid EMSDK refuses expect=package
        run: |
          set -uo pipefail
          if zig build -Dtarget=wasm32-emscripten -Demsdk_expect=package --help > gate.log 2>&1; then
            echo "FAIL: -Demsdk_expect=package passed with a valid EMSDK set"; exit 1
          fi
          grep -F "a valid EMSDK was found and used" gate.log \
            || { cat gate.log; echo "FAIL: expect=package failed for another reason"; exit 1; }
      # A fresh cache dir so the C compiles really run and --verbose-cc prints them.
      - name: Build sokol_clib for wasm from the external EMSDK
        run: |
          set -uo pipefail
          zig build -Dtarget=wasm32-emscripten -Demsdk_expect=external \
            --cache-dir "$RUNNER_TEMP/cc-cache" --verbose-cc --summary all > build.log 2>&1
          status=$?
          grep -v -- " -isystem " build.log | tail -40
          [ "$status" -eq 0 ] || { tail -80 build.log; echo "FAIL: build exited $status"; exit 1; }
          [ -s zig-out/lib/libsokol_clib.a ] || { echo "FAIL: no sokol_clib archive"; exit 1; }
      - name: Assert no emsdk setup ran and only EMSDK's sysroot was used
        run: |
          set -euo pipefail
          if grep -E "\(zig-pkg emsdk\)|run bash" build.log; then
            echo "FAIL: an emsdk install/activate step ran"; exit 1
          fi
          fail=0
          seen=0
          shopt -s nullglob
          for dir in zig-pkg/*/; do
            [ -f "$dir/emsdk.py" ] || continue
            seen=$((seen + 1))
            echo "emsdk package present (fetched, not necessarily used): $dir"
            for marker in upstream .emscripten; do
              if [ -e "$dir$marker" ]; then
                echo "FAIL: $dir$marker exists: the package emsdk was installed/activated"
                fail=1
              fi
            done
          done
          [ "$seen" -gt 0 ] || { echo "FAIL: sokol-zig's emsdk package not found under zig-pkg/, so the check proved nothing"; fail=1; }
          python3 tools/check_cc_sysroot.py build.log "$EMSDK/upstream/emscripten/cache/sysroot/include" sokol_gfx.c || fail=1
          exit $fail

  # labelle-sokol#33, no EMSDK: sokol_clib must use THIS package's emsdk (the
  # same pin as the game's root emsdk, which it links with), install/activate
  # it itself when needed, and never install sokol-zig's different emsdk pin.
  wasm-package-emsdk:
    name: wasm sokol_clib from the package emsdk (never sokol-zig's)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Cache zig-pkg (the package emsdk install)
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: sokol-wasm-zigpkg-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - name: Build sokol_clib for wasm from the package emsdk
        env:
          EMSDK: ''
        run: |
          set -uo pipefail
          zig build -Dtarget=wasm32-emscripten -Demsdk_expect=package \
            --cache-dir "$RUNNER_TEMP/cc-cache" --verbose-cc --summary all > build.log 2>&1
          status=$?
          grep -v -- " -isystem " build.log | tail -40
          [ "$status" -eq 0 ] || { tail -80 build.log; echo "FAIL: build exited $status"; exit 1; }
      - name: Only the package emsdk was installed, and it provides the sysroot
        run: |
          set -euo pipefail
          if grep -F "run bash" build.log; then
            echo "FAIL: sokol-zig's own emsdk setup ran"; exit 1
          fi
          own_hash=$(python3 -c "import re;t=open('build.zig.zon').read();print(re.search(r'\.emsdk\s*=\s*\.\{.*?\.hash\s*=\s*\"([^\"]+)\"',t,re.S).group(1))")
          own="zig-pkg/$own_hash"
          echo "package emsdk: $own"
          [ -d "$own/upstream/emscripten" ] || { echo "FAIL: the package emsdk was not installed"; exit 1; }
          [ -f "$own/.emscripten" ] || { echo "FAIL: the package emsdk was not activated"; exit 1; }
          fail=0
          seen=0
          shopt -s nullglob
          for dir in zig-pkg/*/; do
            [ -f "$dir/emsdk.py" ] || continue
            [ "${dir%/}" = "$own" ] && continue
            seen=$((seen + 1))
            echo "other emsdk package (sokol-zig's): $dir"
            for marker in upstream .emscripten; do
              if [ -e "$dir$marker" ]; then
                echo "FAIL: $dir$marker exists: sokol-zig's emsdk was installed/activated"
                fail=1
              fi
            done
          done
          [ "$seen" -gt 0 ] || { echo "FAIL: sokol-zig's emsdk package not found, so the check proved nothing"; fail=1; }
          python3 tools/check_cc_sysroot.py build.log "$own/upstream/emscripten/cache/sysroot/include" sokol_gfx.c || fail=1
          exit $fail
